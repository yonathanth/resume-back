services:
  - type: web
    name: resume-backend
    env: node
    # Chrome for PDFs goes into the project's .cache folder (.puppeteerrc.cjs), so it's there at run time.
    # npm ci installs exactly the versions in package-lock.json (no surprise upgrades between deploys).
    buildCommand: npm ci && npx puppeteer browsers install chrome && npm run build && npx prisma migrate deploy
    startCommand: npm start
    # A new deploy only takes over once /health answers 200, which needs a
    # working Chrome (PDFs); otherwise the previous deploy keeps serving.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render runs as root, where Chrome won't start without --no-sandbox.
      - key: CHROME_NO_SANDBOX
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: resume-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://moxie-swart-five.vercel.app,https://moxie-9ouuwvhnn-yonathanths-projects.vercel.app
      - key: FRONTEND_URL
        value: https://moxie-swart-five.vercel.app
      - key: GOOGLE_CALLBACK_URL
        value: https://fitcv-backend-xduq.onrender.com/api/v1/auth/google/callback
      - key: REFRESH_COOKIE_SAMESITE
        value: lax
      - key: TRUST_PROXY
        value: true
      - key: PORT
        value: 8000

databases:
  - name: resume-db
    databaseName: resume
    user: resume
